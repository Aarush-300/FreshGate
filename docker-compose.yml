version: "3.8"

services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: bifrost-gateway
    ports:
      - "8080:8080"
    environment:
      - BIFROST_HOST=0.0.0.0
      - BIFROST_PORT=8080
    restart: unless-stopped

  freshgate:
    build: .
    container_name: freshgate-verifier
    ports:
      - "8000:8000"
    environment:
      - BIFROST_UPSTREAM_URL=http://bifrost:8080
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - FRESHGATE_TIMEOUT=4.0
      - FRESHGATE_FAIL_OPEN=true
    depends_on:
      - bifrost
    restart: unless-stopped
