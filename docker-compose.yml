version: "3.8"

services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: bifrost-gateway
    ports:
      - "8080:8080"
    environment:
      - BIFROST_HOST=0.0.0.0
      - BIFROST_PORT=8080
    restart: unless-stopped

  freshgate:
    build: .
    container_name: freshgate-verifier
    ports:
      - "8000:8000"
    environment:
      - BIFROST_UPSTREAM_URL=http://bifrost:8080
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - FRESHGATE_ADMIN_KEY=${FRESHGATE_ADMIN_KEY:-}
      - FRESHGATE_TIMEOUT=4.0
      - FRESHGATE_FAIL_OPEN=true
      - CACHE_DB_PATH=/data/freshgate_cache.db
      - FRESHGATE_AUDIT_DB=/data/freshgate_audit.db
      - FRESHGATE_FEATURE_DB=/data/freshgate_features.db
      - FRESHGATE_WATCHTOWER_ENABLED=${FRESHGATE_WATCHTOWER_ENABLED:-true}
      - FRESHGATE_WATCHTOWER_POLL_SECONDS=${FRESHGATE_WATCHTOWER_POLL_SECONDS:-10}
      - FRESHGATE_WATCHTOWER_MAX_CONCURRENCY=${FRESHGATE_WATCHTOWER_MAX_CONCURRENCY:-2}
      - FRESHGATE_WATCHTOWER_MAX_CLAIMS=${FRESHGATE_WATCHTOWER_MAX_CLAIMS:-1000}
      - FRESHGATE_WATCHTOWER_LEASE_SECONDS=${FRESHGATE_WATCHTOWER_LEASE_SECONDS:-900}
      - FRESHGATE_WATCHTOWER_MAX_RETRIES=${FRESHGATE_WATCHTOWER_MAX_RETRIES:-3}
      - FRESHGATE_WATCHTOWER_RETRY_BASE_SECONDS=${FRESHGATE_WATCHTOWER_RETRY_BASE_SECONDS:-60}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - freshgate_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      bifrost:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: freshgate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  freshgate_data:
  redis_data:
