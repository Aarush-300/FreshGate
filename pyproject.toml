[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshgate-cli"
version = "0.1.0"
description = "Command-line HTTP client for FreshGate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]

[project.scripts]
freshgate = "cli.main:main"

[tool.setuptools]
packages = ["cli"]
